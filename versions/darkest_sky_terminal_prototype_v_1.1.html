<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Darkest Sky – Terminal Prototype</title>
<style>
  :root{
    --bg:#0b0c10; --fg:#d9e0ee; --dim:#8b8f9c; --accent:#7aa2f7; --scan:#121318; --green:#a6e3a1; --red:#f38ba8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  html,body{height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:var(--mono);}
  .wrap{max-width:980px; margin:24px auto; padding:16px;}
  .title{color:var(--accent); margin:0 0 8px 0; font-weight:700;}
  .crt{border:1px solid #181a20; background:linear-gradient(180deg,#0d0f14,#0a0b10); box-shadow:0 0 0 1px #0a0b10 inset,0 0 30px #000 inset; border-radius:8px;}
  .term{padding:16px; min-height:420px; line-height:1.4; white-space:pre-wrap; word-break:break-word;}
  .prompt{display:flex; gap:8px; padding:12px 16px; border-top:1px solid #14161b;}
  .ps1{color:var(--green);} .cwd{color:var(--accent);} .input{flex:1; background:transparent; color:var(--fg); border:0; outline:none; font:inherit;}
  .dim{color:var(--dim);} .err{color:var(--red);} .ok{color:var(--green);} .hint{color:#cba6f7}
  .viewer{border-top:1px dashed #1a1c22; padding:12px 16px; display:none}
  .viewer.open{display:block}
  .img-frame{display:inline-block; position:relative; background:#05060a; border:1px solid #13141a; padding:6px;}
  .img-frame img{max-width:100%; image-rendering:pixelated}
  .spec-wrap{position:relative; display:inline-block}
  .spec-mask{position:absolute; top:0; left:0; bottom:0; background:var(--bg)}
  .kbd{background:#11121a; border:1px solid #1a1b23; padding:1px 6px; border-radius:4px}
  .hr{border-top:1px dashed #1a1c22; margin:10px 0}
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">NebuLink Remote Terminal</h1>
    <div class="crt">
      <div id="term" class="term"></div>
      <div id="viewer" class="viewer"></div>
      <div class="prompt">
        <span class="ps1"><span id="psuser">guest</span>@<span id="pshost">nebula</span></span>$
        <input id="inp" class="input" autofocus spellcheck="false" autocomplete="off" />
      </div>
    </div>
  </div>
<script>
// -------------------------
// Minimal virtual filesystem
// -------------------------
const FILE = (type, content, meta={}) => ({type, content, ...meta});
const DIR  = (children, meta={}) => ({type:"dir", children, ...meta});
const LOCK = (meta={}) => ({type:"lock", ...meta});

// Tiny base64 placeholders (replace later during bundling)
const PNG_DOT = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=";
// A slim 256x64 fake spectrogram (replace later)

const OBS3   = PNG_DOT;

  "/var/observatory/b68": DIR(["README.txt","journal.txt","observation1.img","observation2.img","observation3.img","device_error.log","device_error2.log","device_diag.txt","signals","cycles",".cache","logs","vault"],{}),

  "/var/observatory/b68/cycles/cycle.log": FILE("text", `Night 1:  █ ░ █ ░ █ ░\nNight 2:  ░ █ ░ █ ░ █\nNight 3:  █ █ ░ ░ █ █\nNight 4:  ░ ░ █ █ ░ ░\nNight 5:  █ ░ ░ █ █ ░\nNight 6:  ░ █ █ ░ ░ █\nNight 7:  █ █ █ ░ ░ ░\n(█=1, ░=0)  Use today.\n`),

  "/var/observatory/ravenwood/observationA.img": FILE("image", RVN_A, {caption:"Ravenwood Observation A"}),

  "/var/observatory/ravenwood/artifacts": DIR(["alignments.tab"]),
  "/var/observatory/ravenwood/artifacts/alignments.tab": FILE("text", `theta rho offset\n0.1  0.8  -1\n0.2  0.6  -1\n0.4  0.4  -1\n0.8  0.2  -1\n# total offset -4\n# this line looks important but isn't\n`),
  "/var/observatory/ravenwood/.cache": DIR(["spectrograms"],{hidden:true}),
  "/var/observatory/ravenwood/.cache/spectrograms": DIR(["live.ogg"],{hidden:true}),
  "/var/observatory/ravenwood/.cache/spectrograms/live.ogg": FILE("audio", SPEC00, {note:"decoy: flat"}),

  "/var/observatory/ravenwood/vault/gate.txt": FILE("text", `CIRCLE ONE.\nCIRCLE AGAIN.\nCIRCLE THRICE.\nWHEN YOU COMPLETE THE CIRCLE, YOU WILL FIND THERE WAS NO GATE.\n`),
  "/var/observatory/ravenwood/vault/circle.log": FILE("text", `00 01 01 02 03 05 08 13 21\n# you completed the circle\n# there was no gate\n# return to the canonical target\n`),

// -------------------------
// Terminal implementation
// -------------------------
const term = document.getElementById('term');
const viewer = document.getElementById('viewer');
const inp = document.getElementById('inp');
const cwdSpan = document.getElementById('cwd');
let CWD = "/home/guest";
let LOGGED_IN = true;           // set to false later when we add real login
let USER = "guest";
let TARGET_HOST = "█████ ████ Observatory";

function setPrompt(){
  document.getElementById('psuser').textContent = USER;
  document.getElementById('pshost').textContent = 'nebula'; // replace with sanitized host later
}
setPrompt();

function print(txt=""){ term.appendChild(document.createTextNode(txt+"\n")); term.scrollTop = term.scrollHeight; }
function printHTML(html){ const d=document.createElement('div'); d.innerHTML=html; term.appendChild(d); term.scrollTop=term.scrollHeight; }
function setCwd(p){ CWD=p; cwdSpan.textContent=p; }

function resolve(path){
  if(!path) return CWD;
  if(path.startsWith('/')) return normalize(path);
  return normalize(CWD + (CWD.endsWith('/')?"":"/") + path);
}
function normalize(p){
  const parts = p.split('/');
  const out=[];
  for(const seg of parts){
    if(!seg||seg==='.') continue;
    if(seg==='..') out.pop(); else out.push(seg);
  }
  return '/'+out.join('/');
}
function node(path){ return FS[path]; }
function exists(path){ return !!FS[path]; }
function isDir(n){ return n && n.type==="dir"; }
function isLocked(n){ return n && n.type==="lock"; }

function ls(path, all=false){
  const p = resolve(path);
  const n = node(p);
  if(!n) return `ls: cannot access '${path||""}': No such file or directory`;
  if(!isDir(n)) return `${p}`;
  const list = n.children||[];
  const display = list.filter(name=> all || !name.startsWith('.') ).map(x=>x).join("  ");
  return display;
}

function cd(path){
  if(!path){ setCwd("/home/guest"); return; }
  const p=resolve(path); const n=node(p);
  if(!n) return `cd: ${path}: No such file or directory`;
  if(isLocked(n)) return n.reason||"Permission denied";
  if(!isDir(n)) return `cd: not a directory: ${path}`;
  setCwd(p);
  return null;
}

function cat(path){
  const p=resolve(path); const n=node(p);
  if(!n) return `cat: ${path}: No such file or directory`;
  if(isLocked(n)) return n.reason||"Permission denied";
  if(n.type!=="text") return `cat: ${path}: not a text file`;
  return n.content;
}

function openFile(path){
  const p=resolve(path); const n=node(p);
  if(!n) return `open: ${path}: No such file or directory`;
  if(n.type!=="image") return `open: ${path}: not an image`;
  viewer.classList.add('open');
  viewer.innerHTML = `<div class="img-frame"><img src="${n.content}" alt="${p}"><div class="dim" style="margin-top:6px">${n.caption||p}</div></div>`;
  return null;
}

function spectrogram(path){
  const p=resolve(path); const n=node(p);
  if(!n) return `spectrogram: ${path}: No such file or directory`;
  if(n.type!=="audio") return `spectrogram: ${path}: not an audio file`;
  viewer.classList.add('open');
  const wrap=document.createElement('div'); wrap.className='spec-wrap img-frame';
  const img=new Image(); img.src=n.content; img.className='spec-img';
  const mask=document.createElement('div'); mask.className='spec-mask';
  mask.style.width='100%'; mask.style.left='0px'; mask.style.right='auto';
  wrap.append(img,mask);
  viewer.innerHTML=''; viewer.appendChild(wrap);
  // Slow reveal
  img.onload=()=>{
    const w = img.naturalWidth || 400; // fallback
    let x=0; const step=4; const ms=12; // tune speed
    mask.style.width = w+"px";
    const id=setInterval(()=>{
      x+=step;
      mask.style.left = x+"px";
      if(x>=w){ clearInterval(id); }
    }, ms);
  }
  return null;
}

function hexdump(path){
  const p=resolve(path); const n=node(p);
  if(!n) return `hexdump: ${path}: No such file or directory`;
  if(n.type!=="text") return `hexdump: ${path}: not a raw text source`;
  // naive format: already hex pairs separated by spaces
  const bytes = n.content.trim().split(/\s+/);
  let out='';
  for(let i=0;i<bytes.length;i+=16){
    const row = bytes.slice(i,i+16).join(' ');
    out += row + "\n";
  }
  return out;
}

function stringsCmd(path){
  const p=resolve(path); const n=node(p);
  if(!n) return `strings: ${path}: No such file or directory`;
  // Provide canned outputs for a few decoys
  if(p.endsWith('/var/observatory/ravenwood/signals/station.rvd')){
    return `RVD/1.0\nFRAME 0001\nPAYLOAD START\n...\nFRAME 0002\n...\nopen /var/observatory/ravenwood/vault/gate.txt\n`;
  }
  if(p.endsWith('/var/observatory/ravenwood/.cache/spectrograms/live.ogg')){
    return `LIVE: OFFLINE REPLAY\nMIRRORS MAKE GATES FROM NOTHING\n`;
  }
  if(p.endsWith('/var/observatory/b68/signals/signal01.raw')){
    return `(hint) strip 00, XOR 0x13, then read printables → first number token is 59\n`;
  }
  return "(no printable strings)\n";
}

function man(topic){
  if(topic==="void") return node('/usr/share/man/man1/void.1').content;
  if(topic==="spectrogram") return node('/usr/share/man/man1/spectrogram.1').content;
  return `No manual entry for ${topic}`;
}

function dateCmd(){
  const d=new Date(); return d.toDateString();
}
function timeCmd(){
  const d=new Date(); return d.toLocaleTimeString();
}

function help(){
  return (
    `Available commands:
    help               show this help message
    ls [-a] [path]     list files (use -a to show hidden)
    cd <dir>           change directory (.. to go up)
    pwd                print working directory
    cat <file>         print a text file
    open <image>       view an image (PNG/JPG)
    spectrogram <ogg>  render a spectrogram image slowly
    hexdump <file>     pretty-print hex bytes
    strings <file>     show printable strings (canned for some files)
    man <topic>        mini manual (try: void, spectrogram)
    date / time        show current date or time
    clear              clear screen
    whoami             show user
    `);
}


function listChildren(path, all=false){
  const n=node(path); if(!n||!isDir(n)) return [];
  return (n.children||[]).filter(name=> all || !name.startsWith('.'));
}

function run(cmdline){
  const out=[];
  const parts = cmdline.trim().match(/[^\s"']+|"([^"]*)"|'([^']*)'/g) || [];
  const cmd = (parts[0]||"").toLowerCase();
  const args = parts.slice(1).map(s=>s.replace(/^['"]|['"]$/g,''));
  if(!cmd) return;
  switch(cmd){
    case 'help': out.push(help()); break;
    case 'whoami': out.push('OBSERVER'); break;
    case 'clear': term.textContent=''; break;
    case 'pwd': out.push(CWD); break;
    case 'date': out.push(dateCmd()); break;
    case 'time': out.push(timeCmd()); break;
    case 'echo': out.push(args.join(' ')); break;
    case 'man': out.push(man(args[0]||'')); break;
    case 'ls': {
      let showAll=false, target='';
      for(const a of args){ if(a==='-a') showAll=true; else target=a; }
      out.push(ls(target, showAll));
      break;
    }
    case 'cd': {
      const msg = cd(args[0]); if(msg) out.push(msg); break;
    }
    case 'cat': out.push(cat(args[0])); break;
    case 'open': {
      const msg = openFile(args[0]); if(msg) out.push(msg); break;
    }
    case 'spectrogram': {
      const msg = spectrogram(args[0]); if(msg) out.push(msg); break;
    }
    case 'hexdump': out.push(hexdump(args[0])); break;
    case 'strings': out.push(stringsCmd(args[0])); break;
    case 'head': {
      const t=cat(args[0]); if(typeof t==="string"){ out.push(t.split(/\n/).slice(0,10).join('\n')); } else out.push(t);
      break;
    }
    case 'tail': {
      const t=cat(args[0]); if(typeof t==="string"){ const lines=t.split(/\n/); out.push(lines.slice(Math.max(0,lines.length-10)).join('\n')); } else out.push(t);
      break;
    }
    case 'sudo': out.push('You are not root here.'); break;
    case 'chmod': out.push('ok'); break;
    default: out.push(`${cmd}: command not found`);
  }
  if(out.length){ print(out.join('\n')); }
}
