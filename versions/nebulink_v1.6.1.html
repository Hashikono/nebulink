<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NebuLink Client</title>
<style>
  :root{
    --bg:#0b0c10; --fg:#d9e0ee; --dim:#8b8f9c; --accent:#7aa2f7; --scan:#121318; --green:#a6e3a1; --red:#f38ba8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  html,body{height:90%; margin:0; background:var(--bg); color:var(--fg); font-family:var(--mono);}
  .wrap{max-width:980px; margin:24px auto; padding:16px;}
  .title{color:var(--accent); margin:0 0 8px 0; font-weight:700;}
  .crt{border:1px solid #181a20; background:linear-gradient(180deg,#0d0f14,#0a0b10); box-shadow:0 0 0 1px #0a0b10 inset,0 0 30px #000 inset; border-radius:8px;}
  .term{
    padding:16px;
    height:460px;
    overflow-y:auto;      /* vertical scroll only */
    overflow-x:hidden;    /* hide horizontal scroll */
    line-height:1.4;
    white-space:pre-wrap; /* keep line breaks, wrap long tokens */
    word-break:break-word;/* force wrap if needed */
  }
  .prompt{display:flex; gap:8px; padding:12px 16px; border-top:1px solid #14161b;}
  .ps1{color:var(--green);} .cwd{color:var(--accent);} .input{flex:1; background:transparent; color:var(--fg); border:0; outline:none; font:inherit;}
  .dim{color:var(--dim);} .err{color:var(--red);} .ok{color:var(--green);} .hint{color:#cba6f7}
  .img-frame{display:inline-block; position:relative; background:#05060a; border:1px solid #13141a; padding:6px;}
  .img-frame img{max-width:100%; image-rendering:pixelated}
  .spec-wrap{position:relative; display:inline-block}
  .spec-mask{position:absolute; top:0; left:0; bottom:0; background:var(--bg)}
  .kbd{background:#11121a; border:1px solid #1a1b23; padding:1px 6px; border-radius:4px}
  .hr{border-top:1px dashed #1a1c22; margin:10px 0}
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">NebuLink Remote Terminal</h1>
    <div class="crt">
      <div id="term" class="term"></div>
      <div class="prompt">
        <span class="ps1">
          <span id="psuser">guest</span><span id="at">@</span><span id="pshost">nebula</span>
        </span>:<span id="cwd" class="cwd">~</span> $
        <input id="inp" class="input" autofocus spellcheck="false" autocomplete="off" />
      </div>
    </div>
  </div>

// Unified node factory
function makeFile({path, kind="text", content="", mime="", ext="", hidden=false, locked=false, caption="", note="", meta={}}){
  const node = { type: kind, content, mime, ext, hidden, locked, caption, note, ...meta };
  return [path, node];
}
function makeDir(path, {hidden=false, locked=false} = {}){
  return [path, { type:"dir", hidden, locked, children:[] }];
}

// Extension swapper: "/path/file" + ".img" → "/path/file.img"
function withExt(path, newExt=""){
  if(!newExt) return path;
  return path.replace(/(\.[^\/]+)?$/, newExt.startsWith(".") ? newExt : ("."+newExt));
}

// ===== Build a flat FS map and compute children arrays automatically =====
function buildFS(entries){
  const map = {};
  // Seed all nodes
  for(const [p, node] of entries){ map[p] = node; }
  // Ensure all parents exist as dirs
  for(const p of Object.keys(map)){
    const parent = p.split("/").slice(0,-1).join("/") || "/";
    if(parent && !map[parent]){
      map[parent] = { type:"dir", children:[] };
    }
  }
  // Compute children lists
  for(const p of Object.keys(map)){
    const parent = p.split("/").slice(0,-1).join("/") || "/";
    if(p !== "/" && map[parent] && map[parent].type === "dir"){
      const name = p.split("/").pop();
      const arr = map[parent].children || (map[parent].children = []);
      if(!arr.includes(name)) arr.push(name);
    }
  }
  return map;
}

// -------------------------
// Terminal implementation
// -------------------------
const term = document.getElementById('term');
const inp = document.getElementById('inp');
const cwdSpan = document.getElementById('cwd');
let CWD = "/home/guest";
let LOGGED_IN = false;          // start disconnected
let USER = "guest";
let TARGET_HOST = "█████ ████ Observatory";
let CONNECT_STAGE = 0;          // 0=idle, 1=ask IP, 2=ask user, 3=ask pwd, 4=connecting
let PENDING = { ip:"", user:"", pwd:"" };
const IMG_SCALE = 0.5; // % of terminal width
const SPECTROGRAM_SCALE = 0.90;

// Login credentials
const LOGIN_IP   = "12.34.56.78";
const LOGIN_USER = "guest";
const LOGIN_PASS = "pass";

// ---- Hexdump helpers / limits ----
const HEXDUMP_MAX_BYTES = 2048;   // cap output to protect UI; tweak as you like
const HEXDUMP_SHOW_ASCII = true;

function setPrompt(){
  document.getElementById('psuser').textContent = USER;
  document.getElementById('pshost').textContent = 'nebula'; // replace with sanitized host later
}
setPrompt();

function print(txt=""){ term.appendChild(document.createTextNode(txt+"\n")); term.scrollTop = term.scrollHeight; }
function printHTML(html){ const d=document.createElement('div'); d.innerHTML=html; term.appendChild(d); term.scrollTop=term.scrollHeight; }
function setCwd(p){ CWD=p; cwdSpan.textContent=p; }

function resolve(path){
  if(!path) return CWD;
  if(path.startsWith('/')) return normalize(path);
  return normalize(CWD + (CWD.endsWith('/')?"":"/") + path);
}
function normalize(p){
  const parts = p.split('/');
  const out=[];
  for(const seg of parts){
    if(!seg||seg==='.') continue;
    if(seg==='..') out.pop(); else out.push(seg);
  }
  return '/'+out.join('/');
}
function node(path){ return FS[path]; }
function exists(path){ return !!FS[path]; }
function isDir(n){ return n && n.type==="dir"; }
function isLocked(n){ return !!(n && (n.type === "lock" || n.locked)); }

function ls(path, all=false){
  const p = resolve(path);
  const n = node(p);
  if(!n) return `ls: cannot access '${path||""}': No such file or directory`;
  if(isLocked(n)) return n.reason || "Permission denied";
  if(!isDir(n)) return `${p}`;
  const list = n.children||[];
  const display = list.filter(name=> all || !name.startsWith('.') ).join("  ");
  return display;
}

function cd(path){
  if(!path){ setCwd("/home/guest"); return; }
  const p=resolve(path); const n=node(p);
  if(!n) return `cd: ${path}: No such file or directory`;
  if(isLocked(n)) return n.reason||"Permission denied";
  if(!isDir(n)) return `cd: not a directory: ${path}`;
  setCwd(p);
  return null;
}

function cat(path){
  const p=resolve(path); const n=node(p);
  if(!n) return `cat: ${path}: No such file or directory`;
  if(isLocked(n)) return n.reason||"Permission denied";
  if(n.type!=="text") return `cat: ${path}: not a text file`;
  return n.content;
}

function openFile(path){
  const p = resolve(path); const n = node(p);
  if(!n) return `open: ${path}: No such file or directory`;
  if(n.type !== "image") return `open: ${path}: not an image`;
  if(!n.content || !n.mime || !n.mime.startsWith("image/")) return `open: ${path}: missing/invalid image data`;

  // Compute target pixel width from terminal width
  const termWidth = Math.max(320, term.getBoundingClientRect().width - 2*16); // minus padding
  const targetW   = Math.floor(termWidth * IMG_SCALE);

  const wrap = document.createElement('div');
  wrap.className = 'img-frame';
  wrap.style.display   = 'block';
  wrap.style.maxWidth  = '100%';
  wrap.style.width     = targetW + 'px';

  const img = new Image();
  img.src = n.content;
  img.alt = p;
  img.style.display        = 'block';
  img.style.width          = '100%';     // fill wrapper
  img.style.imageRendering = 'pixelated';

  const cap = document.createElement('div');
  cap.className = 'dim';
  cap.style.marginTop = '6px';
  cap.textContent = n.caption || p;

  wrap.append(img, cap);
  term.appendChild(wrap);
  term.scrollTop = term.scrollHeight;     // scroll once now

  img.onload = () => {
    // and scroll again after it actually affects height
    term.scrollTop = term.scrollHeight;
  };

  return null;
}

function spectrogram(path){
  const p = resolve(path); const n = node(p);
  if(!n) return `spectrogram: ${path}: No such file or directory`;
  if(n.type !== "audio") return `spectrogram: ${path}: not an audio file`;
  if(!n.content || !n.mime || !n.mime.startsWith("image/")) return `spectrogram: ${path}: missing/invalid spectrogram image`;

  const termWidth = Math.max(320, term.getBoundingClientRect().width - 2*16);
  const targetW   = Math.floor(termWidth * SPECTROGRAM_SCALE);

  const outer = document.createElement('div');
  outer.className = 'img-frame spec-wrap';
  outer.style.display  = 'block';
  outer.style.maxWidth = '100%';
  outer.style.width    = targetW + 'px';

  const img = new Image();
  img.src = n.content;
  img.alt = p;
  img.className = 'spec-img';
  img.style.display        = 'block';
  img.style.width          = '100%';
  img.style.imageRendering = 'pixelated';

  const mask = document.createElement('div');
  mask.className = 'spec-mask';
  mask.style.width = '100%';
  mask.style.left  = '0px';
  mask.style.right = 'auto';

  outer.append(img, mask);
  term.appendChild(outer);
  term.scrollTop = term.scrollHeight;

  img.onload = () => {
    const w = Math.floor(outer.getBoundingClientRect().width || 400);
    let x = 0, step = 4, ms = 16;
    mask.style.width = w + 'px';

    const id = setInterval(() => {
      x += step;
      mask.style.left = x + 'px';
      if (x >= w) {
        clearInterval(id);
        term.appendChild(document.createTextNode('\n'));
        term.scrollTop = term.scrollHeight;
      }
    }, ms);

    // ensure we’re scrolled after initial layout
    term.scrollTop = term.scrollHeight;
  };

  return null;
}

function dataUriInfo(uri){
  // returns { mime, isBase64, data } or null
  const m = /^data:([^;,]+)?(?:;charset=[^;,]+)?(;base64)?,(.*)$/i.exec(uri || "");
  if(!m) return null;
  return { mime: m[1] || "", isBase64: !!m[2], data: decodeURIComponent(m[3]) };
}

function base64ToBytes(b64, maxBytes=HEXDUMP_MAX_BYTES){
  // atob decodes base64 → binary string; then to Uint8Array
  const raw = atob(b64);
  const len = Math.min(raw.length, maxBytes);
  const out = new Uint8Array(len);
  for(let i=0;i<len;i++) out[i] = raw.charCodeAt(i) & 0xff;
  return out;
}

function textToBytes(str, maxBytes=HEXDUMP_MAX_BYTES){
  const enc = new TextEncoder();
  const full = enc.encode(str);
  return full.subarray(0, Math.min(full.length, maxBytes));
}

function hexTokensToBytes(txt, maxBytes=HEXDUMP_MAX_BYTES){
  // txt like: "6f 2a 00 2b ..." → bytes
  const tokens = (txt.trim().match(/[0-9a-fA-F]{2}/g) || []);
  const count = Math.min(tokens.length, maxBytes);
  const out = new Uint8Array(count);
  for(let i=0;i<count;i++) out[i] = parseInt(tokens[i],16) & 0xff;
  return out;
}

function nodeToBytes(n, maxBytes=HEXDUMP_MAX_BYTES){
  // Convert a node's content to bytes depending on its type/mime
  if(!n) return new Uint8Array(0);

  if(n.type === "image" || n.type === "audio"){
    // Both image/spectrogram 'audio' store a **data URI** in n.content
    const info = dataUriInfo(n.content);
    if(!info) return textToBytes(String(n.content||""), maxBytes);
    if(info.isBase64){
      return base64ToBytes(info.data, maxBytes);
    }
    // data URI but not base64 → it's percent-encoded text
    return textToBytes(info.data, maxBytes);
  }

  if(n.type === "blob"){
    // treat as hex tokens
    return hexTokensToBytes(String(n.content||""), maxBytes);
  }

  if(n.type === "text"){
    return textToBytes(String(n.content||""), maxBytes);
  }

  // dirs/locks/etc → dump nothing
  return new Uint8Array(0);
}

function formatHexDump(bytes){
  // 16 bytes per line: "0000  6f 2a 00 ...  |o* .|"
  const lines = [];
  const toHex = b => b.toString(16).padStart(2,'0');
  for(let off=0; off<bytes.length; off+=16){
    const chunk = bytes.subarray(off, off+16);
    const hex   = Array.from(chunk).map(toHex);
    const left  = hex.slice(0,8).join(' ');
    const right = hex.slice(8).join(' ');
    let ascii   = '';
    if(HEXDUMP_SHOW_ASCII){
      ascii = Array.from(chunk).map(b=>{
        const c = b>=32 && b<=126 ? String.fromCharCode(b) : '.';
        return c;
      }).join('');
    }
    const addr = off.toString(16).padStart(4,'0');
    const padRight = '   '.repeat(Math.max(0, 16 - chunk.length)); // for alignment when short row
    lines.push(`${addr}  ${left}${left && right ? '  ' : ''}${right}${padRight}${HEXDUMP_SHOW_ASCII ? `  |${ascii}|` : ''}`);
  }
  return lines.join('\n') + (bytes.length >= HEXDUMP_MAX_BYTES ? `\n… (truncated at ${HEXDUMP_MAX_BYTES} bytes)` : '');
}

function hexdump(path){
  const p = resolve(path);
  const n = node(p);
  if(!n) return `hexdump: ${path}: No such file or directory`;
  if(isLocked(n)) return n.reason || "Permission denied";

  // Convert node to bytes (real data for images/audio/text; hex tokens for blob)
  const bytes = nodeToBytes(n, HEXDUMP_MAX_BYTES);
  if(!bytes.length) return `(empty)\n`;

  return formatHexDump(bytes);
}

async function connectFlow(input){
  if(CONNECT_STAGE === 0){
    CONNECT_STAGE = 1;
    await sleep(500);
    print("Remote IP:");
    return;
  }
  if(CONNECT_STAGE === 1){
    const ip = (input || "").trim();
    if(ip !== LOGIN_IP){
      await sleep(1500);
      print("No response from host. Try again.");
      return;
    }
    PENDING.ip = ip;
    CONNECT_STAGE = 2;
    await sleep(700);
    print("Login as:");
    return;
  }
  if(CONNECT_STAGE === 2){
    const user = (input || "").trim();
    if(user !== LOGIN_USER){
      await sleep(800);
      print("Access denied for user.");
      return;
    }
    PENDING.user = user;
    CONNECT_STAGE = 3;
    await sleep(300);
    print(LOGIN_USER + "@" + PENDING.ip + "'s password:");
    return;
  }
  if(CONNECT_STAGE === 3){
    const pwd = (input || "").trim();
    if(pwd !== LOGIN_PASS){
      await sleep(800);
      print("Authentication failed. Please try again.");
      return;
    }
    PENDING.pwd = pwd;

    // success → set session and boot
    CONNECT_STAGE = 4;
    USER = PENDING.user;
    TARGET_HOST = PENDING.ip; // keep with dots
    LOGGED_IN = true;
    setPrompt();
    await boot();
    CONNECT_STAGE = 0;
    return;
  }
}


function run(cmdline){
  const out=[];
  const parts = cmdline.trim().match(/[^\s"']+|"([^"]*)"|'([^']*)'/g) || [];
  const cmd = (parts[0]||"").toLowerCase();
  const args = parts.slice(1).map(s=>s.replace(/^['"]|['"]$/g,''));
  if(!cmd) return;

  // Not connected: allow only connect flow + a couple basics
  if(!LOGGED_IN){
    if(cmd === 'connect'){ connectFlow(); return; }
    if(CONNECT_STAGE === 1 || CONNECT_STAGE === 2 || CONNECT_STAGE === 3){
      // pass the raw input as the user's answer
      connectFlow(cmdline);
      return;
    }
    if(cmd === 'help'){ out.push(`Commands available before connect:\n  connect    start remote session\n`); }
    else if(cmd === 'clear'){ term.textContent=''; }
    else if(cmd === 'whoami'){ out.push(''); } // empty = no user pre-connect
    else { out.push("(not connected) Type 'connect' to begin."); }
    if(out.length) print(out.join('\n'));
    return;
  }


  switch(cmd){
    case 'help': out.push(help()); break;
    case 'whoami': out.push(USER); break;
    case 'clear': term.textContent=''; break;
    case 'pwd': out.push(CWD); break;
    case 'date': out.push(dateCmd()); break;
    case 'time': out.push(timeCmd()); break;
    case 'echo': out.push(args.join(' ')); break;
    case 'man': out.push(man(args[0]||'')); break;
    case 'ls': {
      let showAll=false, target='';
      for(const a of args){ if(a==='-a') showAll=true; else target=a; }
      out.push(ls(target, showAll));
      break;
    }
    case 'cd': {
      const msg = cd(args[0]); if(msg) out.push(msg); break;
    }
    case 'cat': out.push(cat(args[0])); break;
    case 'open': {
      const msg = openFile(args[0]); if(msg) out.push(msg); break;
    }
    case 'spectrogram': {
      const msg = spectrogram(args[0]); if(msg) out.push(msg); break;
    }
    case 'hexdump': out.push(hexdump(args[0])); break;
    case 'head': {
      const t=cat(args[0]); if(typeof t==="string"){ out.push(t.split(/\n/).slice(0,10).join('\n')); } else out.push(t);
      break;
    }
    case 'tail': {
      const t=cat(args[0]); if(typeof t==="string"){ const lines=t.split(/\n/); out.push(lines.slice(Math.max(0,lines.length-10)).join('\n')); } else out.push(t);
      break;
    }
    case 'sudo': out.push('You are not root here.'); break;
    case 'chmod': out.push('ok'); break;
    default: out.push(`${cmd}: command not found`);
  }
  if(out.length){ print(out.join('\n')); }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function isValidIPv4(ip){
  if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) return false;
  return ip.split('.').every(oct => {
    const n = Number(oct);
    return oct.length>0 && n>=0 && n<=255 && String(n)===oct.replace(/^0+(?=\d)/,''); // no leading zeros unless '0'
  });
}

function sanitizeHostForPrompt(host){
  // Allow letters, digits, dashes, dots; strip other stuff
  return String(host).replace(/[^a-zA-Z0-9.-]/g,'');
}

function setPrompt(){

    psUserEl.textContent = '';
    atEl.style.display   = 'none';

}

async function boot(){
  // Full post-connect boot sequence
  await sleep(250);
  print("Authenticated.");

// simple command history
const history = [];
let histIndex = -1;

function completePath(part){
  // Determine directory & base
  const isAbs = part.startsWith('/');
  const sep = part.lastIndexOf('/');
  const dir = sep >= 0 ? part.slice(0, sep) || (isAbs? '/' : '') : '';
  const base = sep >= 0 ? part.slice(sep+1) : part;

  const dirPath = resolve(dir || (isAbs? '/' : ''));
  const n = node(dirPath);
  if(!n || !isDir(n) || isLocked(n)) return {prefix: part, options: []};

  const kids = (n.children || []);
  const options = kids.filter(name => name.startsWith(base));
  const prefix = (dir ? dir + '/' : (isAbs? '/' : ''));
  return {prefix, base, options};
}

inp.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const cmd = inp.value;
    inp.value = '';

    // echo prompt + command
    printHTML(promptLineHTML(cmd));

    // push to history (skip empty)
    if(cmd.trim().length) {
      history.push(cmd);
      histIndex = history.length; // next Up will pull last command
    }

    run(cmd);
  }
  else if(e.key === 'ArrowUp'){
    if(history.length && histIndex > 0){
      histIndex--;
      inp.value = history[histIndex];
      // move cursor to end
      inp.setSelectionRange(inp.value.length, inp.value.length);
      e.preventDefault();
    } else if(history.length && histIndex === history.length){
      // first press after a command
      histIndex = history.length - 1;
      inp.value = history[histIndex];
      inp.setSelectionRange(inp.value.length, inp.value.length);
      e.preventDefault();
    }
  }
  else if(e.key === 'ArrowDown'){
    if(history.length && histIndex < history.length - 1){
      histIndex++;
      inp.value = history[histIndex];
      inp.setSelectionRange(inp.value.length, inp.value.length);
      e.preventDefault();
    } else if(history.length){
      // past the newest → clear
      histIndex = history.length;
      inp.value = '';
      e.preventDefault();
    }
  } else if(e.key === 'Tab'){
      e.preventDefault();
      const before = inp.value;
      const parts = before.trim().match(/[^\s"']+|"([^"]*)"|'([^']*)'/g) || [];
      if(!parts.length) return;

      // autocomplete only the last token (path-like)
      const last = parts[parts.length - 1].replace(/^['"]|['"]$/g,'');
      const {prefix, base, options} = completePath(last);

      if(options.length === 1){
        // single match → complete fully
        const completed = prefix + options[0];
        parts[parts.length - 1] = completed;
        inp.value = parts.join(' ');
      } else if(options.length > 1){
        // multiple → print options, keep the longest common prefix
        const lcp = (arr)=>{
          if(!arr.length) return '';
          let s = arr[0];
          for(const t of arr){
            let i=0; while(i < s.length && i < t.length && s[i] === t[i]) i++;
            s = s.slice(0,i);
            if(!s) break;
          }
          return s;
        };
        const names = options.map(x => x);
        const common = lcp(names);
        if(common && common.length > base.length){
          const completed = prefix + common;
          parts[parts.length - 1] = completed;
          inp.value = parts.join(' ');
        }
        print(options.join('  '));
      }
      // move cursor to end
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }

});
