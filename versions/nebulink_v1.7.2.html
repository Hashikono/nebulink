<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NebuLink Client</title>
<style>
  :root{
    --bg:#0b0c10; --fg:#d9e0ee; --dim:#8b8f9c; --accent:#7aa2f7; --scan:#121318; --green:#a6e3a1; --red:#f38ba8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  html,body{height:90%; margin:0; background:var(--bg); color:var(--fg); font-family:var(--mono);}
  .wrap{max-width:980px; margin:24px auto; padding:16px;}
  .title{color:var(--accent); margin:0 0 8px 0; font-weight:700;}
  .crt{border:1px solid #181a20; background:linear-gradient(180deg,#0d0f14,#0a0b10); box-shadow:0 0 0 1px #0a0b10 inset,0 0 30px #000 inset; border-radius:8px;}
  .term{
    padding:16px;
    height:460px;
    overflow-y:auto;      /* vertical scroll only */
    overflow-x:hidden;    /* hide horizontal scroll */
    line-height:1.4;
    white-space:pre-wrap; /* keep line breaks, wrap long tokens */
    word-break:break-word;/* force wrap if needed */
  }
  .prompt{display:flex; gap:8px; padding:12px 16px; border-top:1px solid #14161b;}
  .ps1{color:var(--green);} .cwd{color:var(--accent);} .input{flex:1; background:transparent; color:var(--fg); border:0; outline:none; font:inherit;}
  .dim{color:var(--dim);} .err{color:var(--red);} .ok{color:var(--green);} .hint{color:#cba6f7}
  .img-frame{display:inline-block; position:relative; background:#05060a; border:1px solid #13141a; padding:6px;}
  .img-frame img{max-width:100%; image-rendering:pixelated}
  .spec-wrap{position:relative; display:inline-block}
  .spec-mask{position:absolute; top:0; left:0; bottom:0; background:var(--bg)}
  .kbd{background:#11121a; border:1px solid #1a1b23; padding:1px 6px; border-radius:4px}
  .hr{border-top:1px dashed #1a1c22; margin:10px 0}
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">NebuLink Remote Terminal</h1>
    <div class="crt">
      <div id="term" class="term"></div>
      <div class="prompt">
        <span class="ps1">
          <span id="psuser">guest</span><span id="at">@</span><span id="pshost">nebula</span>
        </span>:<span id="cwd" class="cwd">~</span> $
        <input id="inp" class="input" autofocus spellcheck="false" autocomplete="off" />
      </div>
    </div>
  </div>

/*
New entry shapes:

  // directory
  { kind:"dir", dir:"/var/observatory", locked:false, hidden:false }

  // file
  { kind:"text"|"image"|"audio"|"file",
    dir:"/var/observatory/b68",
    name:"observation1.img",       // include whatever extension you want in *name*
    content: "...",                // string (text or data URI)
    hidden:false,
    locked:false,
    corrupted:false                // if true => only hexdump can read it
  }

Notes:
- No 'mime', 'ext', 'note', or 'caption'.
- 'file' is a generic kind (neither image/audio/text). Use it for station.rvd, raw dumps, etc.
*/

function entryDir(dir, {hidden=false, locked=false} = {}){
  return { kind:"dir", dir, hidden, locked };
}
function entryFile({dir, name, kind="text", content="", hidden=false, locked=false, corrupted=false}){
  return { kind, dir, name, content, hidden, locked, corrupted };
}

// Build FS: produce a flat map of fullPath -> node, and auto children arrays for dirs
function buildFS(entries){
  const FS = {};
  const ensureDir = (path)=>{
    if(!FS[path]) FS[path] = { kind:"dir", dir:path, hidden:false, locked:false, children:[] };
    else if(FS[path].kind!=="dir") FS[path] = { kind:"dir", dir:path, hidden:false, locked:false, children:[] };
  };

  // seed
  for(const e of entries){
    if(e.kind === "dir"){
      FS[e.dir] = { kind:"dir", dir:e.dir, hidden:!!e.hidden, locked:!!e.locked, children:[] };
    }else{
      const parent = e.dir || "/";
      const full = (parent.endsWith("/") ? parent.slice(0,-1) : parent) + "/" + e.name;
      FS[full] = {
        kind: e.kind, dir: parent, name: e.name,
        content: e.content || "",
        hidden: !!e.hidden, locked: !!e.locked, corrupted: !!e.corrupted
      };
      // ensure parent dir
      ensureDir(parent);
    }
  }

  // ensure all parent directories exist
  for(const path of Object.keys(FS)){
    const parts = path.split("/");
    parts.pop();
    const parent = parts.join("/") || "/";
    ensureDir(parent);
  }

  // compute children
  for(const path of Object.keys(FS)){
    if(path === "/") continue;
    const parts = path.split("/");
    const name = parts.pop();
    const parent = parts.join("/") || "/";
    if(FS[parent] && FS[parent].kind === "dir"){
      const arr = FS[parent].children || (FS[parent].children = []);
      if(!arr.includes(name)) arr.push(name);
    }
  }

  return FS;
}

// ---- Path + node helpers (clean) ----
function node(path){ return FS[path]; }
function isDir(n){ return !!(n && n.kind === "dir"); }
function isLocked(n){ return !!(n && n.locked); }

// normalize absolute or relative path against CWD
function normalizePath(pathLike){
  if(!pathLike) return CWD || '/';
  if(pathLike === '/') return '/';
  const parts = [];
  for(const seg of pathLike.split('/')){
    if(!seg || seg === '.') continue;
    if(seg === '..'){ if(parts.length) parts.pop(); continue; }
    parts.push(seg);
  }
  return '/' + parts.join('/');
}

// resolve user input to an absolute path
function resolve(input){
  const s = (input || '').trim();
  if(!s) return CWD || '/';
  if(s.startsWith('/')) return normalizePath(s);
  // relative to CWD
  const base = (CWD && CWD !== '/') ? (CWD + '/' + s) : ('/' + s);
  return normalizePath(base);
}

// --- unified path + node helpers (do not duplicate these elsewhere) ---
function node(path){ return FS[path]; }

// normalize absolute or relative path against CWD
function normalizePath(pathLike){
  if(!pathLike) return CWD || '/';
  if(pathLike === '/') return '/';
  const parts = [];
  for(const seg of pathLike.split('/')){
    if(!seg || seg === '.') continue;
    if(seg === '..'){ if(parts.length) parts.pop(); continue; }
    parts.push(seg);
  }
  return '/' + parts.join('/');
}

// resolve user input to an absolute path
function resolve(input){
  const s = (input || '').trim();
  if(!s) return CWD || '/';
  if(s.startsWith('/')) return normalizePath(s);
  const base = (CWD && CWD !== '/') ? (CWD + '/' + s) : ('/' + s);
  return normalizePath(base);
}

function ls(path, showAll=false){
  const p = path ? resolve(path) : CWD;
  const n = node(p);
  if(!n) return `ls: cannot access '${path||''}': No such file or directory`;
  if(isLocked(n)) return "Permission denied";
  if(!isDir(n)){
    // match common shells: if it's a file, print its path/name
    return p;
  }
  const kids = n.children || [];
  const names = kids.filter(name=>{
    // filter dotfiles when -a not set
    if(!showAll && name.startsWith('.')) return false;
    const childPath = (p === '/' ? '' : p) + '/' + name;
    const child = node(childPath);
    if(!showAll && child && child.hidden) return false;
    return true;
  });
  return names.join('  ');
}

function cd(arg){
  const target = (arg && arg.trim()) ? resolve(arg) : '/home/guest';
  const n = node(target);
  if(!n) return `cd: ${arg||''}: No such file or directory`;
  if(isLocked(n)) return "Permission denied";
  if(!isDir(n)) return `cd: ${arg||target}: Not a directory`;
  CWD = target;
  cwdSpan.textContent = CWD;
  return null;
}

function cat(path){
  const p=resolve(path); const n=node(p);
  if(!n) return `cat: ${path}: No such file or directory`;
  if(isLocked(n)) return "Permission denied";
  if(isDir(n)) return `cat: ${path}: is a directory`;
  if(n.corrupted) return `cat: ${path}: file is corrupted, use hexdump to inspect`;
  if(n.kind !== "text") return `cat: ${path}: not a text file`;
  return n.content;
}

function openFile(path){
  const p = resolve(path); const n = node(p);
  if(!n) return `open: ${path}: No such file or directory`;
  if(isLocked(n)) return "Permission denied";
  if(isDir(n)) return `open: ${path}: is a directory`;
  if(n.corrupted) return `open: ${path}: file is corrupted, use hexdump to inspect`;
  if(n.kind !== "image") return `open: ${path}: not an image`;

  // basic check that it's a data URI
  const info = dataUriInfo(n.content || "");
  if(!info) return `open: ${path}: invalid image data`;

  // Compute target pixel width from terminal width
  const termWidth = Math.max(320, term.getBoundingClientRect().width - 32);
  const targetW   = Math.floor(termWidth * IMG_SCALE);

  const wrap = document.createElement('div');
  wrap.className = 'img-frame';
  wrap.style.display   = 'block';
  wrap.style.maxWidth  = '100%';
  wrap.style.width     = targetW + 'px';

  const img = new Image();
  img.src = n.content;
  img.alt = p;
  img.style.display        = 'block';
  img.style.width          = '100%';
  img.style.imageRendering = 'pixelated';

  wrap.append(img);
  term.appendChild(wrap);
  term.scrollTop = term.scrollHeight;

  img.onload = () => { term.scrollTop = term.scrollHeight; };
  return null;
}

// ===== Real spectrogram engine (adapted) =====
// Tunables
const SPEC_MAX_COLS        = 1200;     // upper bound on intrinsic columns before decimation
const SPEC_TARGET_SR       = 16000;    // resample target Hz
const SPEC_FFT_SIZE        = 1024;     // 512..4096 (power of 2)
const SPEC_HOP_SIZE        = SPEC_FFT_SIZE >> 2; // 75% overlap
const SPEC_DB_FLOOR        = -80;      // dynamic range floor
const SPEC_COLS_PER_FRAME  = 1;        // progressive draw speed

// Audio decoding helpers
function dataUrlFromMaybeBase64(s) {
  const raw = (s||'').trim();
  if (!raw) throw new Error('No audio provided.');
  return raw.startsWith('data:') ? raw : ('data:audio/wav;base64,' + raw);
}
function arrayBufferFromDataURL(dataURL) {
  const comma = dataURL.indexOf(',');
  if (comma === -1) throw new Error('Invalid data URL.');
  const b64 = dataURL.slice(comma + 1);
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
async function decodeAudioBuffer(ab) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  try {
    const buf = await ac.decodeAudioData(ab.slice(0));
    try { ac.close(); } catch(_) {}
    return buf;
  } catch (e) { try { ac.close(); } catch(_) {} throw e; }
}
function downmixMono(buffer) {
  const chans = [...Array(buffer.numberOfChannels)].map((_,c)=>buffer.getChannelData(c));
  if (chans.length === 1) return chans[0];
  const len = chans[0].length, out = new Float32Array(len);
  for (let i=0;i<len;i++){ let s=0; for(let c=0;c<chans.length;c++) s+=chans[c][i]; out[i]=s/chans.length; }
  return out;
}
function resampleLinear(signal, inRate, outRate) {
  if (Math.abs(outRate - inRate) < 1) return signal;
  const ratio = inRate / outRate;
  const outLen = Math.max(1, Math.floor(signal.length / ratio));
  const out = new Float32Array(outLen);
  for (let i=0;i<outLen;i++){
    const x = i*ratio, x0 = Math.floor(x), x1 = Math.min(signal.length-1, x0+1);
    const t = x-x0; out[i] = signal[x0]*(1-t) + signal[x1]*t;
  }
  return out;
}

// Window + FFT
const SPEC_HANN = new Float32Array(SPEC_FFT_SIZE);
for(let i=0;i<SPEC_FFT_SIZE;i++) SPEC_HANN[i] = 0.5*(1 - Math.cos(2*Math.PI*i/(SPEC_FFT_SIZE-1)));
function fftRadix2(re, im){
  const n=re.length;
  for(let i=0,j=0;i<n;i++){
    if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}
    let m=n>>1; while(m>=1 && j>=m){j-=m; m>>=1;} j+=m;
  }
  for(let size=2; size<=n; size<<=1){
    const half=size>>1, theta=-2*Math.PI/size, wpr=Math.cos(theta), wpi=Math.sin(theta);
    for(let start=0; start<n; start+=size){
      let wr=1, wi=0;
      for(let k=0;k<half;k++){
        const i0=start+k, i1=i0+half;
        const tr=wr*re[i1]-wi*im[i1], ti=wr*im[i1]+wi*re[i1];
        re[i1]=re[i0]-tr; im[i1]=im[i0]-ti; re[i0]+=tr; im[i0]+=ti;
        const tmp=wr*wpr - wi*wpi; wi=wr*wpi + wi*wpr; wr=tmp;
      }
    }
  }
}

// STFT → normalized dB in [0,1]
function stftDb(signal){
  const n = SPEC_FFT_SIZE, hop = SPEC_HOP_SIZE, bins=(n>>1)+1;
  const frames = Math.max(1, Math.floor((signal.length - n)/hop) + 1);
  const mags = new Float32Array(bins*frames);
  const re = new Float32Array(n), im = new Float32Array(n);

  for(let f=0,pos=0; f<frames; f++, pos+=hop){
    for(let i=0;i<n;i++){ const s=signal[pos+i]||0; re[i]=s*SPEC_HANN[i]; im[i]=0; }
    fftRadix2(re,im);
    for(let k=0;k<bins;k++){
      const mr=re[k], mi=im[k];
      mags[k + f*bins] = Math.hypot(mr,mi) / (n/2);
    }
  }
  // convert to dB, normalize
  const db = new Float32Array(mags.length);
  let maxDb=-Infinity;
  for(let i=0;i<mags.length;i++){
    const v = mags[i] > 1e-12 ? 20*Math.log10(mags[i]) : SPEC_DB_FLOOR - 60;
    db[i]=v; if(v>maxDb) maxDb=v;
  }
  const floor = Math.max(SPEC_DB_FLOOR, maxDb + SPEC_DB_FLOOR);
  const range = Math.max(1e-6, maxDb - floor);
  for(let i=0;i<db.length;i++) db[i] = Math.min(1, Math.max(0, (db[i]-floor)/range));
  return { db, bins, frames };
}

// palette (0..255 → rgb), black→purple→magenta→red→orange→yellow→white
const SPEC_LUT = (() => {
  const stops = [
    [0.00,[0,0,0]],[0.16,[64,0,128]],[0.33,[255,0,255]],
    [0.50,[255,0,0]],[0.66,[255,128,0]],[0.83,[255,255,0]],[1.00,[255,255,255]]
  ];
  const lut = new Array(256);
  for(let i=0;i<256;i++){
    const t=i/255; let a=stops[0], b=stops[stops.length-1];
    for(let s=0;s<stops.length-1;s++){ if(t>=stops[s][0] && t<=stops[s+1][0]){ a=stops[s]; b=stops[s+1]; break; } }
    const u = (t-a[0])/Math.max(1e-9,(b[0]-a[0]));
    lut[i]=[
      Math.round(a[1][0]+(b[1][0]-a[1][0])*u),
      Math.round(a[1][1]+(b[1][1]-a[1][1])*u),
      Math.round(a[1][2]+(b[1][2]-a[1][2])*u)
    ];
  }
  return lut;
})();

async function playCmd(path){
  const p = resolve(path); const n = node(p);
  if(!n) return `play: ${path}: No such file or directory`;
  if(isLocked(n)) return "Permission denied";
  if(isDir(n)) return `play: ${path}: is a directory`;
  if(n.corrupted) return `play: ${path}: file is corrupted`;
  if(n.kind !== "audio") return `play: ${path}: not an audio file`;

  // Decode audio buffer (reuse helpers from spectrogram engine)
  const dataURL = dataUrlFromMaybeBase64(n.content);
  const ab = arrayBufferFromDataURL(dataURL);

  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  let buf;
  try {
    buf = await ac.decodeAudioData(ab.slice(0));
  } catch (e) {
    try { ac.close(); } catch(_){}
    return `play: ${path}: ${e && e.message ? e.message : e}`;
  }

  // Stop any existing playback, then start
  stopPlayback(false);
  __audioCtx = ac;
  __audioSrc = ac.createBufferSource();
  __audioSrc.buffer = buf;
  __audioSrc.connect(ac.destination);
  __isPlaying = true;
  const myToken = ++__playToken;

  __audioSrc.onended = () => {
    if(myToken !== __playToken) return;
    __isPlaying = false;
    try { ac.close(); } catch(_){}
    __audioCtx = null;
    __audioSrc = null;
    print("⏹  Finished.");
  };

  __audioSrc.start(0);
  print("▶  Playing… (press any key to stop)");
  return null;
}

async function spectrogram(path){
  const p = resolve(path); const n = node(p);
  if(!n) return `spectrogram: ${path}: No such file or directory`;
  if(isLocked(n)) return "Permission denied";
  if(isDir(n)) return `spectrogram: ${path}: is a directory`;
  if(n.corrupted) return `spectrogram: ${path}: file is corrupted, use hexdump to inspect`;
  if(n.kind !== "audio") return `spectrogram: ${path}: not an audio file`;

  // Build wrapper sized like your image renderer (scaled to terminal width)
  const termWidth = Math.max(320, term.getBoundingClientRect().width - 32);
  const targetW   = Math.floor(termWidth * SPECTROGRAM_SCALE);

  const outer = document.createElement('div');
  outer.className = 'img-frame spec-wrap';
  outer.style.display  = 'block';
  outer.style.maxWidth = '100%';
  outer.style.width    = targetW + 'px';

  const canvas = document.createElement('canvas');
  canvas.style.display        = 'block';
  canvas.style.width          = '100%';
  canvas.style.imageRendering = 'pixelated';
  canvas.style.background     = '#000';

  const status = document.createElement('div');
  status.className = 'dim';
  status.style.marginTop = '6px';
  status.textContent = 'Decoding...';

  outer.append(canvas, status);
  term.appendChild(outer);
  term.scrollTop = term.scrollHeight;

  // Progressive renderer (cancel previous runs if user triggers again)
  const myToken = ++spectrogram.__token;

  try {
    // 1) Decode
    const dataURL = dataUrlFromMaybeBase64(n.content);
    const ab = arrayBufferFromDataURL(dataURL);
    const buf = await decodeAudioBuffer(ab);
    if(myToken !== spectrogram.__token) return null;

    // 2) Prep mono @ SPEC_TARGET_SR
    status.textContent = 'Preparing...';
    const mono = downmixMono(buf);
    const sig  = resampleLinear(mono, buf.sampleRate, SPEC_TARGET_SR);
    const { db, bins, frames } = stftDb(sig);
    if(myToken !== spectrogram.__token) return null;

    // 3) Decide intrinsic columns (≤ SPEC_MAX_COLS)
    const decimate = Math.ceil(Math.max(1, frames / SPEC_MAX_COLS));
    const outW = Math.ceil(frames / decimate);
    const outH = bins;

    // Canvas sizing (DPR aware), CSS handles width scaling to wrapper
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const ctx = canvas.getContext('2d', { willReadFrequently:true });
    canvas.width  = outW * dpr;
    canvas.height = outH * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Offscreen 1px column to build each column
    const off = document.createElement('canvas');
    off.width = outW; off.height = outH;
    const offCtx = off.getContext('2d', { willReadFrequently:true });
    const colImg = offCtx.createImageData(1, outH);

    // 4) Progressive draw loop
    let x = 0;
    function drawStep(){
      if(myToken !== spectrogram.__token) return;
      const toDraw = Math.min(SPEC_COLS_PER_FRAME, outW - x);
      for(let t=0; t<toDraw; t++, x++){
        const x0 = x * decimate, x1 = Math.min(frames, x0 + decimate);
        for(let y=0; y<outH; y++){
          let acc=0, cnt=0;
          for(let s=x0; s<x1; s++){ acc += db[y + s*outH]; cnt++; }
          const v01 = cnt ? (acc/cnt) : 0;
          const yy = (outH-1) - y; // flip vertically (top=high freq)
          const idx = yy*4;
          const [r,g,b] = SPEC_LUT[(v01*255)|0];
          colImg.data[idx+0]=r; colImg.data[idx+1]=g; colImg.data[idx+2]=b; colImg.data[idx+3]=255;
        }
        offCtx.putImageData(colImg, x, 0);
      }
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(off, 0, 0);
      status.textContent = `Rendering ${Math.round((x/outW)*100)}%`;
      if(x < outW) requestAnimationFrame(drawStep);
      else status.textContent = `Done (${outW}×${outH})`;
    }
    requestAnimationFrame(drawStep);
  } catch (e){
    status.textContent = 'Error';
    print(`spectrogram: ${path}: ${e && e.message ? e.message : e}`);
  }
  return null;
}
spectrogram.__token = 0;

// ==== Audio playback state (for `play` command) ====
let __audioCtx = null;
let __audioSrc = null;
let __isPlaying = false;
let __playToken = 0;

function stopPlayback(printMsg=true){
  try { if(__audioSrc) { __audioSrc.onended = null; __audioSrc.stop(0); } } catch(_){}
  try { if(__audioCtx) { __audioCtx.close(); } } catch(_){}
  __audioSrc = null; __audioCtx = null; __isPlaying = false;
  if(printMsg) print("⏹  Stopped.");
}

function dataUriInfo(uri){
  // returns { mime, isBase64, data } or null
  const m = /^data:([^;,]+)?(?:;charset=[^;,]+)?(;base64)?,(.*)$/i.exec(uri || "");
  if(!m) return null;
  return { mime: m[1] || "", isBase64: !!m[2], data: decodeURIComponent(m[3]) };
}

function base64ToBytes(b64, maxBytes=HEXDUMP_MAX_BYTES){
  // atob decodes base64 → binary string; then to Uint8Array
  const raw = atob(b64);
  const len = Math.min(raw.length, maxBytes);
  const out = new Uint8Array(len);
  for(let i=0;i<len;i++) out[i] = raw.charCodeAt(i) & 0xff;
  return out;
}

function textToBytes(str, maxBytes=HEXDUMP_MAX_BYTES){
  const enc = new TextEncoder();
  const full = enc.encode(str);
  return full.subarray(0, Math.min(full.length, maxBytes));
}

function hexTokensToBytes(txt, maxBytes=HEXDUMP_MAX_BYTES){
  // txt like: "6f 2a 00 2b ..." → bytes
  const tokens = (txt.trim().match(/[0-9a-fA-F]{2}/g) || []);
  const count = Math.min(tokens.length, maxBytes);
  const out = new Uint8Array(count);
  for(let i=0;i<count;i++) out[i] = parseInt(tokens[i],16) & 0xff;
  return out;
}

function nodeToBytes(n, maxBytes=HEXDUMP_MAX_BYTES){
  if(!n) return new Uint8Array(0);
  if(isDir(n)) return new Uint8Array(0);

  // If corrupted: never try to decode as image/audio; just fall through to generic
  if(n.corrupted){
    // if the content looks like hex tokens, interpret as such
    const txt = String(n.content || "");
    if(/^[0-9a-fA-F]{2}(\s+[0-9a-fA-F]{2})+/.test(txt)) return hexTokensToBytes(txt, maxBytes);
    return textToBytes(txt, maxBytes);
  }

  if(n.kind === "image" || n.kind === "audio"){
    const info = dataUriInfo(n.content || "");
    if(!info) return textToBytes(String(n.content||""), maxBytes);
    if(info.isBase64) return base64ToBytes(info.data, maxBytes);
    return textToBytes(info.data, maxBytes);
  }

  if(n.kind === "text"){
    return textToBytes(String(n.content||""), maxBytes);
  }

  // 'file' (generic) → treat as text bytes or hex tokens if present
  const txt = String(n.content || "");
  if(/^[0-9a-fA-F]{2}(\s+[0-9a-fA-F]{2})+/.test(txt)) return hexTokensToBytes(txt, maxBytes);
  return textToBytes(txt, maxBytes);
}

function formatHexDump(bytes){
  // 16 bytes per line: "0000  6f 2a 00 ...  |o* .|"
  const lines = [];
  const toHex = b => b.toString(16).padStart(2,'0');
  for(let off=0; off<bytes.length; off+=16){
    const chunk = bytes.subarray(off, off+16);
    const hex   = Array.from(chunk).map(toHex);
    const left  = hex.slice(0,8).join(' ');
    const right = hex.slice(8).join(' ');
    let ascii   = '';
    if(HEXDUMP_SHOW_ASCII){
      ascii = Array.from(chunk).map(b=>{
        const c = b>=32 && b<=126 ? String.fromCharCode(b) : '.';
        return c;
      }).join('');
    }
    const addr = off.toString(16).padStart(4,'0');
    const padRight = '   '.repeat(Math.max(0, 16 - chunk.length)); // for alignment when short row
    lines.push(`${addr}  ${left}${left && right ? '  ' : ''}${right}${padRight}${HEXDUMP_SHOW_ASCII ? `  |${ascii}|` : ''}`);
  }
  return lines.join('\n') + (bytes.length >= HEXDUMP_MAX_BYTES ? `\n… (truncated at ${HEXDUMP_MAX_BYTES} bytes)` : '');
}

function hexdump(path){
  const p = resolve(path);
  const n = node(p);
  if(!n) return `hexdump: ${path}: No such file or directory`;
  if(isLocked(n)) return n.reason || "Permission denied";

  // Convert node to bytes (real data for images/audio/text; hex tokens for blob)
  const bytes = nodeToBytes(n, HEXDUMP_MAX_BYTES);
  if(!bytes.length) return `(empty)\n`;

  return formatHexDump(bytes);
}

function man(topic){
  const key = (topic||'').toLowerCase();
  if (!key) return "What manual page do you want?";
  return MAN[key] || `No manual entry for ${topic}`;
}

function dateCmd(){
  const d=new Date(); return d.toDateString();
}
function timeCmd(){
  const d=new Date(); return d.toLocaleTimeString();
}

`Available commands:

  man <topic>         mini manual (try: spectrogram, play, rm, exit)

  ls [-a] [path]      list files (use -a to show hidden)
  cd <dir>            change directory (.. to go up)
  pwd                 print working directory

function isFile(n){ return !!(n && !isDir(n)); }

function removeFromParent(fullPath){
  const parts = fullPath.split('/');
  const name = parts.pop();
  const parent = parts.join('/') || '/';
  const parentNode = node(parent);
  if(parentNode && parentNode.children){
    const i = parentNode.children.indexOf(name);
    if(i >= 0) parentNode.children.splice(i,1);
  }
}

function removeNode(fullPath, {force=false, recursive=false}={}){
  const n = node(fullPath);
  if(!n){
    if(force) return null;
    return `rm: cannot remove '${fullPath}': No such file or directory`;
  }
  if(isLocked(n)) return `Permission denied`;

  if(isDir(n)){
    if(!recursive) return `rm: cannot remove '${fullPath}': Is a directory`;
    // Recurse children first
    const kids = (n.children || []).slice(); // copy
    for(const name of kids){
      const child = (fullPath === '/' ? '/' + name : fullPath + '/' + name);
      const err = removeNode(child, {force, recursive});
      if(err && !force) return err; // stop on first error if not forcing
    }
  }

  // Finally, delete this node (skip root)
  if(fullPath !== '/'){
    delete FS[fullPath];
    removeFromParent(fullPath);
  } else {
    return `rm: refusing to remove root '/'`;
  }
  return null;
}

function expandPathToken(token){
  // We don't implement general globs; support the easter-egg literal '*'
  if(token === '*'){
    const kids = (node(CWD)?.children || []).map(n => (CWD==='/'?'/'+n:CWD+'/'+n));
    return kids;
  }
  return [ resolve(token) ];
}

// Main rm command parser
function rmCommand(argv){
  let force=false, recursive=false;
  const paths=[];

  for(const a of argv){
    if(a === '-f') force=true;
    else if(a === '-r' || a === '-R') recursive=true;
    else if(a === '-rf' || a === '-fr'){ force=true; recursive=true; }
    else { paths.push(a); }
  }

  // Easter egg: rm -rf *  (in current working directory)
  if(force && recursive && paths.length === 1 && paths[0] === '*'){
    systemCrash();
    return ''; // nothing else to print
  }

  if(paths.length === 0){
    return `rm: missing operand`;
  }

  // Optional guest restriction: block recursive outside /home/guest
  if(recursive){
    const outside = paths.some(p=>{
      const abs = resolve(p);
      return !abs.startsWith('/home/guest/');
    });
    if(outside){
      return `rm: recursive removal outside /home/guest is not permitted for guest`;
    }
  }

  const messages=[];
  for(const raw of paths){
    const expanded = expandPathToken(raw);
    if(!expanded.length){
      if(!force) messages.push(`rm: cannot remove '${raw}': No such file or directory`);
      continue;
    }
    for(const full of expanded){
      const err = removeNode(full, {force, recursive});
      if(err && !force) messages.push(`rm: cannot remove '${raw}': ${err}`);
    }
  }
  return messages.join('\n');
}

function exitCmd(){
  // Stop audio + cancel any running spectrogram reveals
  stopPlayback(false);
  if(typeof spectrogram === 'function' && typeof spectrogram.__token === 'number'){
    spectrogram.__token++;
  }
  LOGGED_IN = false;
  CONNECT_STAGE = 0;
  CWD = '/home/guest';
  setPrompt();
  print("Disconnected. Type 'connect' to start a new session.");
  return null;
}

function listChildren(path, all=false){
  const n=node(path); if(!n||!isDir(n)) return [];
  return (n.children||[]).filter(name=> all || !name.startsWith('.'));
}

async function connectFlow(input){
  if(CONNECT_STAGE === 0){
    CONNECT_STAGE = 1;
    await sleep(500);
    print("Remote IP:");
    return;
  }
  if(CONNECT_STAGE === 1){
    const ip = (input || "").trim();
    if(ip !== LOGIN_IP){
      await sleep(1500);
      print("No response from host. Try again.");
      return;
    }
    PENDING.ip = ip;
    CONNECT_STAGE = 2;
    await sleep(700);
    print("Login as:");
    return;
  }
  if(CONNECT_STAGE === 2){
    const user = (input || "").trim();
    if(user !== LOGIN_USER){
      await sleep(800);
      print("Access denied for user.");
      return;
    }
    PENDING.user = user;
    CONNECT_STAGE = 3;
    await sleep(300);
    print(LOGIN_USER + "@" + PENDING.ip + "'s password:");
    return;
  }
  if(CONNECT_STAGE === 3){
    const pwd = (input || "").trim();
    if(pwd !== LOGIN_PASS){
      await sleep(800);
      print("Authentication failed. Please try again.");
      return;
    }
    PENDING.pwd = pwd;

    // success → set session and boot
    CONNECT_STAGE = 4;
    USER = PENDING.user;
    TARGET_HOST = PENDING.ip; // keep with dots
    LOGGED_IN = true;
    setPrompt();
    await boot();
    CONNECT_STAGE = 0;
    return;
  }
}

function run(cmdline){
  const out=[];
  const parts = cmdline.trim().match(/[^\s"']+|"([^"]*)"|'([^']*)'/g) || [];
  const cmd = (parts[0]||"").toLowerCase();
  const args = parts.slice(1).map(s=>s.replace(/^['"]|['"]$/g,''));
  if(!cmd) return;

  // Not connected: allow only connect flow + a couple basics
  if(!LOGGED_IN){
    if(cmd === 'connect'){ connectFlow(); return; }
    if(CONNECT_STAGE === 1 || CONNECT_STAGE === 2 || CONNECT_STAGE === 3){
      // pass the raw input as the user's answer
      connectFlow(cmdline);
      return;
    }
    if(cmd === 'help'){ out.push(`Commands available before connect:\n  connect    start remote session\n`); }
    else if(cmd === 'clear'){ term.textContent=''; }
    else if(cmd === 'whoami'){ out.push(''); } // empty = no user pre-connect
    else { out.push("(not connected) Type 'connect' to begin."); }
    if(out.length) print(out.join('\n'));
    return;
  }

  // Box is damaged: any command just errors out
  if (DAMAGED && cmd !== 'exit' && cmd !== 'clear') {
    CWD = '/';
    print("I/O error: superblock unreadable (read-only filesystem)");
    return;
  }

  switch(cmd){
    case 'help': out.push(help()); break;
    case 'whoami': out.push(USER); break;
    case 'clear': term.textContent=''; break;
    case 'pwd': out.push(CWD); break;
    case 'date': out.push(dateCmd()); break;
    case 'time': out.push(timeCmd()); break;
    case 'echo': out.push(args.join(' ')); break;
    case 'man': out.push(man(args[0]||'')); break;
    case 'ls': {
      let showAll=false, target='';
      for(const a of args){ if(a==='-a') showAll=true; else if(!target) target=a; }
      out.push(ls(target, showAll));
      break;
    }
    case 'cd': {
      const msg = cd(args[0]); if(msg) out.push(msg); break;
    }
    case 'cat': out.push(cat(args[0])); break;
    case 'open': {
      const msg = openFile(args[0]); if(msg) out.push(msg); break;
    }
    case 'spectrogram': {
      const ret = spectrogram(args[0]);
      if(ret && typeof ret.then === 'function'){
        ret.then(msg => { if(typeof msg === 'string' && msg) print(msg); });
      } else if(typeof ret === 'string' && ret){
        out.push(ret);
      }
      break;
    }
    case 'play': {
      const ret = playCmd(args[0]);
      if(ret && typeof ret.then === 'function'){
        ret.then(msg => { if(typeof msg === 'string' && msg) print(msg); });
      } else if(typeof ret === 'string' && ret){
        out.push(ret);
      }
      break;
    }
    case 'stop': stopPlayback(); break;
    case 'hexdump': out.push(hexdump(args[0])); break;
    case 'head': {
      const t=cat(args[0]); if(typeof t==="string"){ out.push(t.split(/\n/).slice(0,10).join('\n')); } else out.push(t);
      break;
    }
    case 'tail': {
      const t=cat(args[0]); if(typeof t==="string"){ const lines=t.split(/\n/); out.push(lines.slice(Math.max(0,lines.length-10)).join('\n')); } else out.push(t);
      break;
    }
    case 'sudo': out.push('You are not root here.'); break;
    case 'chmod': out.push('ok'); break;
    case 'rm': {
      const msg = rmCommand(args);
      if(msg) out.push(msg);
      break;
    }
    case 'exit': {
      const msg = exitCmd();
      if(msg) out.push(msg);
      break;
    }
    default: out.push(`${cmd}: command not found`);
  }
  if(out.length){ print(out.join('\n')); }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function systemCrash(){
  DAMAGED = true;        // remember that the box is damaged across logins
  EASTER_RELOGIN_SHOWN = false;

  // Stop audio / spectrograms
  try { stopPlayback(false); } catch(_){}
  if(typeof spectrogram === 'function' && typeof spectrogram.__token === 'number'){
    spectrogram.__token++;
  }

  // Kernel panic on screen
  await sleep(300);
  print("KERNEL PANIC: recursive delete across volume");
  await sleep(70);
  print("All sessions will be terminated.");
  print("");

  // After a beat, exit/log out
  setTimeout(()=>{
    exitCmd();  // prints Disconnected. Type 'connect'...
  }, 900);
}

function sanitizeHostForPrompt(host){
  // Allow letters, digits, dashes, dots; strip other stuff
  return String(host).replace(/[^a-zA-Z0-9.-]/g,'');
}

function setPrompt(){
  const psUserEl = document.getElementById('psuser');
  const atEl     = document.getElementById('at');
  const psHostEl = document.getElementById('pshost');

  if (LOGGED_IN) {
    psUserEl.textContent = USER;
    atEl.style.display   = '';
    psHostEl.textContent = sanitizeHostForPrompt(TARGET_HOST);
    cwdSpan.textContent = CWD || '/home/guest';
    cwdSpan.textContent = DAMAGED ? '/' : CWD;
  } else {
    // pre-connect: host only, no user
    psUserEl.textContent = '';
    atEl.style.display   = 'none';
    psHostEl.textContent = 'nebula';
    cwdSpan.textContent  = '~';
  }
}

// use this everywhere you echo the prompt line
function promptLineHTML(cmd){
  const psUser = document.getElementById('psuser').textContent;
  const psHost = document.getElementById('pshost').textContent;
  const userPart = psUser ? `${psUser}@` : '';
  return (
    `<span class="dim">${userPart}${psHost}</span>:` +
    `<span class="cwd">${LOGGED_IN ? CWD : '~'}</span> $ ${cmd}`
  );
}

function startBanner(){
  setPrompt();
  printHTML(`<span class="dim">NebuLink Remote v0.9.2</span>`);
  print(`Type 'connect' to begin.`);
}

async function boot(){
  // Full post-connect boot sequence
  await sleep(250);
  print("Authenticated.");
  await sleep(350);
  print("Initializing session...");
  await sleep(800);
  print(`Target: ${TARGET_HOST}`);
  await sleep(150);
  print("Establishing secure link...");
  await sleep(570);
  print("Connecting to host...");
  await sleep(540);
  print("Status: connected");
  await sleep(200);
  // If the system is damaged (from the rm -rf * egg), show the Easter image once.
  if (DAMAGED) {
    if (ASSETS && ASSETS.EASTER && !EASTER_RELOGIN_SHOWN) {
      const termWidth = Math.max(320, term.getBoundingClientRect().width - 32);
      const targetW   = Math.floor(termWidth * (typeof IMG_SCALE!=='undefined' ? IMG_SCALE : 0.85));

      const wrap = document.createElement('div');
      wrap.className = 'img-frame';
      wrap.style.display   = 'block';
      wrap.style.maxWidth  = '100%';
      wrap.style.width     = targetW + 'px';

      const img = new Image();
      img.src = ASSETS.EASTER;
      img.alt = 'EASTER';
      img.style.display        = 'block';
      img.style.width          = '100%';
      img.style.imageRendering = 'pixelated';
      img.onload = () => { term.scrollTop = term.scrollHeight; };
      wrap.append(img);
      term.appendChild(wrap);
      term.scrollTop = term.scrollHeight;
      EASTER_RELOGIN_SHOWN = true;
    }
    CWD = '/';
    print("I/O error: superblock unreadable (read-only filesystem)");
    print(""); // spacer
    return; // skip rest of boot text
  }
  print("");
  print(cat('/etc/motd'));
  await sleep(50);
  print("User: " + USER);
  await sleep(20);
  print(`Last login: ${LAST_LOGIN} on ttyS1`);
  await sleep(20);
  print("Type 'help' for commands.");
  LAST_LOGIN = dateCmd() + ' ' + timeCmd();
}

startBanner();

// simple command history
const history = [];
let histIndex = -1;

function completePath(part){
  const raw = (part || '').trim();
  const abs = raw.startsWith('/');
  const sep = raw.lastIndexOf('/');

  // Exactly-as-typed directory portion (could be '', '.', '..', '../x', '/var', etc.)
  const typedDir = sep >= 0 ? raw.slice(0, sep) : '';
  const base     = sep >= 0 ? raw.slice(sep+1) : raw;

  // Resolved absolute path of that directory (used only for looking up children)
  const resolvedDir = abs ? (typedDir || '/') : resolve(typedDir || '');
  const dirNode = node(resolvedDir);
  if(!dirNode || !isDir(dirNode) || isLocked(dirNode)){
    return {
      displayPrefix: raw,   // fall back to leaving the token untouched
      fullPrefix: resolvedDir, // (unused in this case)
      base,
      options: []
    };
  }

  const options = (dirNode.children || []).filter(name => name.startsWith(base));

  // What to INSERT back into the input (preserve user's style):
  //  - If user typed absolute: keep their typedDir (or '/'), then a single '/'
  //  - If user typed relative: keep their typedDir verbatim (could be '..' or '../x') then '/'
  const displayPrefix = abs
    ? ((typedDir || '/').replace(/\/+$/,'') + '/')
    : (typedDir ? typedDir.replace(/\/+$/,'') + '/' : '');

  // What to use to CHECK nodes in the FS (always absolute)
  const fullPrefix = (resolvedDir === '/') ? '/' : (resolvedDir + '/');

  return { displayPrefix, fullPrefix, base, options };
}

inp.addEventListener('keydown', (e)=>{
    // If audio is playing, any key press stops it and swallows this keystroke
  if(__isPlaying){
    stopPlayback(true);
    // Clear pending input and do NOT handle this keystroke as a command
    if(e.key) { e.preventDefault(); e.stopPropagation(); }
    inp.value = '';
    return;
  }
  if(e.key === 'Enter'){
    const cmd = inp.value;
    inp.value = '';

    // echo prompt + command
    printHTML(promptLineHTML(cmd));

    // push to history (skip empty)
    if(cmd.trim().length) {
      history.push(cmd);
      histIndex = history.length; // next Up will pull last command
    }

    run(cmd);
  }
  else if(e.key === 'ArrowUp'){
    if(history.length && histIndex > 0){
      histIndex--;
      inp.value = history[histIndex];
      // move cursor to end
      inp.setSelectionRange(inp.value.length, inp.value.length);
      e.preventDefault();
    } else if(history.length && histIndex === history.length){
      // first press after a command
      histIndex = history.length - 1;
      inp.value = history[histIndex];
      inp.setSelectionRange(inp.value.length, inp.value.length);
      e.preventDefault();
    }
  }
  else if(e.key === 'ArrowDown'){
    if(history.length && histIndex < history.length - 1){
      histIndex++;
      inp.value = history[histIndex];
      inp.setSelectionRange(inp.value.length, inp.value.length);
      e.preventDefault();
    } else if(history.length){
      // past the newest → clear
      histIndex = history.length;
      inp.value = '';
      e.preventDefault();
    }
  } else if(e.key === 'Tab'){
    e.preventDefault();
    const before = inp.value;
    const parts = before.trim().match(/[^\s"']+|"([^"]*)"|'([^']*)'/g) || [];
    if(!parts.length) return;

    const last = parts[parts.length - 1].replace(/^['"]|['"]$/g,'');
    const { displayPrefix, fullPrefix, base, options } = completePath(last);

    if(options.length === 1){
      const name = options[0];

      // Absolute path to check if the completion is a directory:
      const fullAbs = (fullPrefix === '/' ? '/' + name : fullPrefix + name);
      const n = node(fullAbs);
      const isDirMatch = !!(n && isDir(n));

      // What we INSERT back into the input should respect user's original style:
      let completed = displayPrefix + name;
      if (isDirMatch && !completed.endsWith('/')) completed += '/';

      parts[parts.length - 1] = completed;
      inp.value = parts.join(' ');
    } else if(options.length > 1){
      // Complete to longest common prefix, preserving style
      const lcp = (arr)=>{
        if(!arr.length) return '';
        let s = arr[0];
        for(const t of arr){
          let i=0; while(i < s.length && i < t.length && s[i] === t[i]) i++;
          s = s.slice(0,i);
          if(!s) break;
        }
        return s;
      };
      const common = lcp(options);
      if(common && common.length > base.length){
        parts[parts.length - 1] = displayPrefix + common;
        inp.value = parts.join(' ');
      }
      print(options.join('  '));
    }

    // cursor to end
    inp.setSelectionRange(inp.value.length, inp.value.length);
  }
});
