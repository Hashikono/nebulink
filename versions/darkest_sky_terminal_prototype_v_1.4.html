// -------------------------
// Minimal virtual filesystem
// -------------------------
const FILE = (type, content, meta={}) => ({type, content, ...meta});
const DIR  = (children, meta={}) => ({type:"dir", children, ...meta});
const LOCK = (meta={}) => ({type:"lock", ...meta});

// ===== File registry + helpers =====

// Central place for data URIs (just paste your base64 here)

  obs1:  "data:image/png;base64,...",          // observation1.png
  obs2:  "data:image/png;base64,...",
  obs3:  "data:image/png;base64,...",
  spec49:"data:image/png;base64,...",          // spectrogram image

};

// Unified node factory
function makeFile({path, kind="text", content="", mime="", ext="", hidden=false, locked=false, caption="", note="", meta={}}){
  const node = { type: kind, content, mime, ext, hidden, locked, caption, note, ...meta };
  return [path, node];
}
function makeDir(path, {hidden=false, locked=false} = {}){
  return [path, { type:"dir", hidden, locked, children:[] }];
}

// Extension swapper: "/path/file" + ".img" → "/path/file.img"
function withExt(path, newExt=""){
  if(!newExt) return path;
  return path.replace(/(\.[^\/]+)?$/, newExt.startsWith(".") ? newExt : ("."+newExt));
}

// ===== Build a flat FS map and compute children arrays automatically =====
function buildFS(entries){
  const map = {};
  // Seed all nodes
  for(const [p, node] of entries){ map[p] = node; }
  // Ensure all parents exist as dirs
  for(const p of Object.keys(map)){
    const parent = p.split("/").slice(0,-1).join("/") || "/";
    if(parent && !map[parent]){
      map[parent] = { type:"dir", children:[] };
    }
  }
  // Compute children lists
  for(const p of Object.keys(map)){
    const parent = p.split("/").slice(0,-1).join("/") || "/";
    if(p !== "/" && map[parent] && map[parent].type === "dir"){
      const name = p.split("/").pop();
      const arr = map[parent].children || (map[parent].children = []);
      if(!arr.includes(name)) arr.push(name);
    }
  }
  return map;
}

// ===== Declarative FS entries =====

// Build FS map from entries (auto children)
const FS = buildFS(ENTRIES);


// -------------------------
// Terminal implementation
// -------------------------
const term = document.getElementById('term');
const inp = document.getElementById('inp');
const cwdSpan = document.getElementById('cwd');
let CWD = "/home/guest";
let LOGGED_IN = true;           // set to false later when we add real login
let USER = "guest";
let TARGET_HOST = "█████ ████ Observatory";

function setPrompt(){
  document.getElementById('psuser').textContent = USER;
  document.getElementById('pshost').textContent = 'nebula'; // replace with sanitized host later
}
setPrompt();

function print(txt=""){ term.appendChild(document.createTextNode(txt+"\n")); term.scrollTop = term.scrollHeight; }
function printHTML(html){ const d=document.createElement('div'); d.innerHTML=html; term.appendChild(d); term.scrollTop=term.scrollHeight; }
function setCwd(p){ CWD=p; cwdSpan.textContent=p; }

function resolve(path){
  if(!path) return CWD;
  if(path.startsWith('/')) return normalize(path);
  return normalize(CWD + (CWD.endsWith('/')?"":"/") + path);
}
function normalize(p){
  const parts = p.split('/');
  const out=[];
  for(const seg of parts){
    if(!seg||seg==='.') continue;
    if(seg==='..') out.pop(); else out.push(seg);
  }
  return '/'+out.join('/');
}
function node(path){ return FS[path]; }
function exists(path){ return !!FS[path]; }
function isDir(n){ return n && n.type==="dir"; }
function isLocked(n){ return n && n.type==="lock"; }

function ls(path, all=false){
  const p = resolve(path);
  const n = node(p);
  if(!n) return `ls: cannot access '${path||""}': No such file or directory`;
  if(!isDir(n)) return `${p}`;
  const list = n.children||[];
  const display = list.filter(name=> all || !name.startsWith('.') ).map(x=>x).join("  ");
  return display;
}

function cd(path){
  if(!path){ setCwd("/home/guest"); return; }
  const p=resolve(path); const n=node(p);
  if(!n) return `cd: ${path}: No such file or directory`;
  if(isLocked(n)) return n.reason||"Permission denied";
  if(!isDir(n)) return `cd: not a directory: ${path}`;
  setCwd(p);
  return null;
}

function cat(path){
  const p=resolve(path); const n=node(p);
  if(!n) return `cat: ${path}: No such file or directory`;
  if(isLocked(n)) return n.reason||"Permission denied";
  if(n.type!=="text") return `cat: ${path}: not a text file`;
  return n.content;
}

function openFile(path){
  const p = resolve(path); const n = node(p);
  if(!n) return `open: ${path}: No such file or directory`;
  if(n.type !== "image") return `open: ${path}: not an image`;
  if(!n.content || !n.mime.startsWith("image/")) return `open: ${path}: missing/invalid image data`;

  const wrap = document.createElement('div');
  wrap.className = 'img-frame';
  const img = new Image();
  img.src = n.content;
  img.alt = p;
  img.style.display = 'block';
  img.style.maxWidth = '100%';
  img.style.imageRendering = 'pixelated';
  const cap = document.createElement('div');
  cap.className = 'dim';
  cap.style.marginTop = '6px';
  cap.textContent = n.caption || p;

  wrap.append(img, cap);
  term.appendChild(wrap);
  term.scrollTop = term.scrollHeight;
  return null;
}



function spectrogram(path){
  const p = resolve(path); const n = node(p);
  if(!n) return `spectrogram: ${path}: No such file or directory`;
  if(n.type !== "audio") return `spectrogram: ${path}: not an audio file`;
  if(!n.content || !n.mime.startsWith("image/")) return `spectrogram: ${path}: missing/invalid spectrogram image`;

  const outer = document.createElement('div');
  outer.className = 'img-frame spec-wrap';

  const img = new Image();
  img.src = n.content;
  img.alt = p;
  img.className = 'spec-img';
  img.style.display = 'block';
  img.style.maxWidth = '100%';
  img.style.imageRendering = 'pixelated';

  const mask = document.createElement('div');
  mask.className = 'spec-mask';
  mask.style.width = '100%';
  mask.style.left = '0px';
  mask.style.right = 'auto';

  outer.append(img, mask);
  term.appendChild(outer);
  term.scrollTop = term.scrollHeight;

  img.onload = () => {
    const w = img.naturalWidth || outer.getBoundingClientRect().width || 400;
    let x = 0, step = 2, ms = 20;
    mask.style.width = w + 'px';
    const id = setInterval(() => {
      x += step;
      mask.style.left = x + 'px';
      if (x >= w) { clearInterval(id); term.appendChild(document.createTextNode('\n')); term.scrollTop = term.scrollHeight; }
    }, ms);
  };
  return null;
}

function hexdump(path){
  const p=resolve(path); const n=node(p);
  if(!n) return `hexdump: ${path}: No such file or directory`;
  if(n.type!=="text" && n.type!=="blob") return `hexdump: ${path}: not a hex-like file`;
  const bytes = n.content.trim().split(/\s+/);
  let out='';
  for(let i=0;i<bytes.length;i+=16) out += bytes.slice(i,i+16).join(' ') + "\n";
  return out;
}

function stringsCmd(path){
  const p=resolve(path); const n=node(p);
  if(!n) return `strings: ${path}: No such file or directory`;
  // Provide canned outputs for a few decoys
  if(p.endsWith('/var/observatory/ravenwood/signals/station.rvd')){
    return `RVD/1.0\nFRAME 0001\nPAYLOAD START\n...\nFRAME 0002\n...\nopen /var/observatory/ravenwood/vault/gate.txt\n`;
  }
  if(p.endsWith('/var/observatory/ravenwood/.cache/spectrograms/live.ogg')){
    return `LIVE: OFFLINE REPLAY\nMIRRORS MAKE GATES FROM NOTHING\n`;
  }
  if(p.endsWith('/var/observatory/b68/signals/signal01.raw')){
    return `(hint) strip 00, XOR 0x13, then read printables → first number token is 59\n`;
  }
  return "(no printable strings)\n";
}

function man(topic){
  if(topic==="void") return node('/usr/share/man/man1/void.1').content;
  if(topic==="spectrogram") return node('/usr/share/man/man1/spectrogram.1').content;
  return `No manual entry for ${topic}`;
}

function dateCmd(){
  const d=new Date(); return d.toDateString();
}
function timeCmd(){
  const d=new Date(); return d.toLocaleTimeString();
}

function help(){
  return (
    `Available commands:
    help               show this help message
    ls [-a] [path]     list files (use -a to show hidden)
    cd <dir>           change directory (.. to go up)
    pwd                print working directory
    cat <file>         print a text file
    open <image>       view an image (PNG/JPG)
    spectrogram <ogg>  render a spectrogram image slowly
    hexdump <file>     pretty-print hex bytes
    strings <file>     show printable strings (canned for some files)
    man <topic>        mini manual (try: void, spectrogram)
    date / time        show current date or time
    clear              clear screen
    whoami             show user
    `);
}


function listChildren(path, all=false){
  const n=node(path); if(!n||!isDir(n)) return [];
  return (n.children||[]).filter(name=> all || !name.startsWith('.'));
}

function run(cmdline){
  const out=[];
  const parts = cmdline.trim().match(/[^\s"']+|"([^"]*)"|'([^']*)'/g) || [];
  const cmd = (parts[0]||"").toLowerCase();
  const args = parts.slice(1).map(s=>s.replace(/^['"]|['"]$/g,''));
  if(!cmd) return;
  switch(cmd){
    case 'help': out.push(help()); break;
    case 'whoami': out.push(USER); break;
    case 'clear': term.textContent=''; break;
    case 'pwd': out.push(CWD); break;
    case 'date': out.push(dateCmd()); break;
    case 'time': out.push(timeCmd()); break;
    case 'echo': out.push(args.join(' ')); break;
    case 'man': out.push(man(args[0]||'')); break;
    case 'ls': {
      let showAll=false, target='';
      for(const a of args){ if(a==='-a') showAll=true; else target=a; }
      out.push(ls(target, showAll));
      break;
    }
    case 'cd': {
      const msg = cd(args[0]); if(msg) out.push(msg); break;
    }
    case 'cat': out.push(cat(args[0])); break;
    case 'open': {
      const msg = openFile(args[0]); if(msg) out.push(msg); break;
    }
    case 'spectrogram': {
      const msg = spectrogram(args[0]); if(msg) out.push(msg); break;
    }
    case 'hexdump': out.push(hexdump(args[0])); break;
    case 'strings': out.push(stringsCmd(args[0])); break;
    case 'head': {
      const t=cat(args[0]); if(typeof t==="string"){ out.push(t.split(/\n/).slice(0,10).join('\n')); } else out.push(t);
      break;
    }
    case 'tail': {
      const t=cat(args[0]); if(typeof t==="string"){ const lines=t.split(/\n/); out.push(lines.slice(Math.max(0,lines.length-10)).join('\n')); } else out.push(t);
      break;
    }
    case 'sudo': out.push('You are not root here.'); break;
    case 'chmod': out.push('ok'); break;
    default: out.push(`${cmd}: command not found`);
  }
  if(out.length){ print(out.join('\n')); }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
async function boot(){
  await sleep(150);
  printHTML(`<span class="dim">NebuLink Remote v0.9.2</span>`);
  await sleep(1250);
  print("Initializing session...");
  await sleep(1950);
  print("Target: █████ ████ Observatory");
  await sleep(2350);
  print("Establishing secure link...");
  await sleep(1750); 
  print("Connecting to host...");
  await sleep(850);
  print("Status: connected");
  await sleep(950);
  print("");
  print(cat('/etc/motd'));
  await sleep(50);
  print("Login as: guest");
  await sleep(50);
  // Story-aligned: logs go through 1991-01-10 → make last login just before that
  print("Last login: Thu Jan 10 1991 23:08:12 PST on ttyS1");
  await sleep(50);
  print("Type 'help' for commands.");
}

boot();

// simple command history
const history = [];
let histIndex = -1;

inp.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const cmd = inp.value;
    inp.value = '';

    // echo prompt + command
    const psUser = document.getElementById('psuser').textContent;
    const psHost = document.getElementById('pshost').textContent;
    printHTML(
      `<span class="dim">${psUser}@${psHost}</span>:` +
      `<span class="cwd">${CWD}</span>$ ${cmd}`
    );

    // push to history (skip empty)
    if(cmd.trim().length) {
      history.push(cmd);
      histIndex = history.length; // next Up will pull last command
    }

    run(cmd);
  }
  else if(e.key === 'ArrowUp'){
    if(history.length && histIndex > 0){
      histIndex--;
      inp.value = history[histIndex];
      // move cursor to end
      inp.setSelectionRange(inp.value.length, inp.value.length);
      e.preventDefault();
    } else if(history.length && histIndex === history.length){
      // first press after a command
      histIndex = history.length - 1;
      inp.value = history[histIndex];
      inp.setSelectionRange(inp.value.length, inp.value.length);
      e.preventDefault();
    }
  }
  else if(e.key === 'ArrowDown'){
    if(history.length && histIndex < history.length - 1){
      histIndex++;
      inp.value = history[histIndex];
      inp.setSelectionRange(inp.value.length, inp.value.length);
      e.preventDefault();
    } else if(history.length){
      // past the newest → clear
      histIndex = history.length;
      inp.value = '';
      e.preventDefault();
    }
  }
});
